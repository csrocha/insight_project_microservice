name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  IMAGE: csrocha/tj3-ms

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build locally first so we can run tests against the exact image that will be pushed
      - name: Build test image
        run: docker build --target test -t ${{ env.IMAGE }}:ci-test .

      - name: Run tests inside container
        run: docker run --rm ${{ env.IMAGE }}:ci-test pytest tests/ -v

      # Push to Docker Hub only on develop (not on PRs)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
